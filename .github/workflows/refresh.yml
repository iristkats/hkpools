name: refresh pool data

# 06:00 and 14:00 Hong Kong time (UTC+8). GitHub runs cron in UTC.
on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 HKT
    - cron: "0 6 * * *"    # 14:00 HKT
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install requests beautifulsoup4 lxml

      # parser tests run with no network — catches a regex regression
      # before a malformed pools.json can ever be published
      - name: Test parsers
        run: python scraper.py --selftest

      # keep what is currently published, to compare the scrape against
      - name: Snapshot the published data
        run: cp pools.json published.json

      - name: Scrape LCSD
        run: |
          python scraper.py -o pools.json --verbose
          python enrich.py
          python facilities.py

      # counts alone cannot tell a good scrape from a confident wrong one,
      # so this also refuses a large regression against the published copy
      - name: Sanity-check the result
        run: python sanity.py pools.json published.json

      # the freshly scraped data must still drive both consumers identically,
      # and still satisfy the engine's invariants
      - name: Status-engine parity on the new data
        run: node parity.js

      # runs only when a venue is still unplaced, and prints at the end of the
      # log where it can actually be read. Delete with the gap it explains.
      - name: Explain any unresolved venue
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          import scraper

          gaps = [p for p in json.load(open("pools.json"))["pools"] if p.get("data_gap")]
          if not gaps:
              print("every venue resolved"); raise SystemExit
          print("unresolved: " + ", ".join(p["name"] for p in gaps))

          harvested = scraper.harvest_district_ids(verbose=True)
          print(f"harvest returned {len(harvested)} names")
          for key in sorted(harvested)[:5]:
              print("   sample:", harvested[key])

          r = requests.get(scraper.DISTRICT_PAGE.format(16), headers=scraper.UA, timeout=30)
          print(f"dist=loc16 -> HTTP {r.status_code}, {len(r.text)} chars")
          soup = BeautifulSoup(r.text, "lxml")
          anchors = soup.find_all("a", href=True)
          print(f"  {len(anchors)} anchors total")
          for a in anchors:
              txt = a.get_text(" ", strip=True)
              if "pool" in txt.lower() or "swp" in a["href"].lower():
                  print(f"     {txt[:50]!r} -> {a['href'][:70]}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "hkpools bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f published.json
          git add pools.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data: refresh $(date -u +%Y-%m-%d\ %H:%M)Z"
          git push
